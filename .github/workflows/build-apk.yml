name: Build my APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Turn on Pro features
        run: |
          sed -i 's/val hasPro: Boolean get() = Entitlement.PRO in entitlements/val hasPro: Boolean get() = true/' \
            app/src/main/java/com/charles/livecaptionn/billing/PremiumState.kt
          grep -n "val hasPro" app/src/main/java/com/charles/livecaptionn/billing/PremiumState.kt

      - name: Turn off ads
        run: echo "ads.enabled=false" > local.properties

      - name: Add placeholder Firebase file
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.charles.livecaptionn"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "placeholder-api-key" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: app/build/outputs/apk/**/*.apk
